version: 1
disable_existing_loggers: False

formatters:
  standard:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  # Production JSON-like format
  production_json:
    format: '{"timestamp": "%(asctime)s", "logger": "%(name)s", "level": "%(levelname)s", "message": %(message)s}'

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout

  production_file:
    class: logging.FileHandler
    level: INFO
    formatter: production_json
    filename: "logs/production_inference.jsonl"
    mode: "a"

loggers:
  prediction_logger:
    level: INFO
    handlers: [production_file, console]
    propagate: False

root:
  level: WARNING
  handlers: [console]
